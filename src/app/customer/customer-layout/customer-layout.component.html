<div class="cust-shell">

  <!-- Top navbar -->
  <header class="cust-nav">
    <div class="cust-nav-inner">
      <!-- Brand -->
      <a routerLink="/" class="cust-brand">
        <span class="cust-brand-logo">LW</span>
        <span class="cust-brand-name">Livwell</span>
      </a>

      <!-- Desktop nav links -->
      <nav class="cust-nav-links">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active" class="cust-nav-link">
            {{ item.label }}
          </a>
        }
      </nav>

      <!-- Right side -->
      <div class="cust-nav-right">
        <div class="cust-user-pill">
          <div class="cust-avatar">{{ initials() }}</div>
          <span class="cust-user-name">{{ auth.currentUser()?.name }}</span>
        </div>
        <button class="cust-logout-btn" (click)="logout()" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>

        <!-- Mobile hamburger -->
        <button class="cust-hamburger" (click)="toggleMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile drawer -->
    @if (menuOpen()) {
      <div class="cust-mobile-menu" (click)="closeMenu()">
        @for (item of navItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active" class="cust-mobile-link">
            {{ item.label }}
          </a>
        }
        <button class="cust-mobile-logout" (click)="logout()">Sign Out</button>
      </div>
    }
  </header>

  <!-- Page content -->
  <main class="cust-main">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="cust-footer">
    <span>© 2026 Livwell Real Estate. All rights reserved.</span>
    <a routerLink="/">Back to website</a>
  </footer>

</div>
