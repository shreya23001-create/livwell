<!-- ============================================================
     LUXURY PROJECTS PAGE
     ============================================================ -->
<div class="lxp-page">

  <!-- ── Page Header ──────────────────────────────────────── -->
  <div class="lxp-header">
    <div class="lxp-breadcrumb">
      <a routerLink="/" class="lxp-bc-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      <span class="lxp-bc-sep">›</span>
      <span class="lxp-bc-current">{{ pageTitle() }}</span>
    </div>
    <div class="lxp-title-box">
      <h1 class="lxp-page-title">{{ pageTitle() }}</h1>
    </div>
  </div>

  <!-- ── Project Cards ───────────────────────────────────── -->
  <div class="lxp-list">
    <div *ngFor="let p of projects" class="lxp-card">

      <!-- Image -->
      <div class="lxp-card-img-wrap">
        <img [src]="p.image" [alt]="p.title" class="lxp-card-img" loading="lazy">
        <div class="lxp-card-img-overlay"></div>
        <span *ngIf="p.badge" class="lxp-badge">{{ p.badge }}</span>
        <span class="lxp-status" [ngClass]="statusClass(p.status)">{{ p.status }}</span>
      </div>

      <!-- Details -->
      <div class="lxp-card-body">
        <div class="lxp-card-top">
          <div class="lxp-card-meta">
            <span class="lxp-card-type">{{ p.type }}</span>
            <span class="lxp-card-sep">·</span>
            <span class="lxp-card-beds">{{ p.beds }}</span>
          </div>
          <h2 class="lxp-card-title">{{ p.title }}</h2>
          <div class="lxp-card-developer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            {{ p.developer }}
          </div>
          <div class="lxp-card-location">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
            </svg>
            {{ p.location }}
          </div>
        </div>

        <!-- Price block -->
        <div class="lxp-card-pricing">
          <div class="lxp-price-main">
            <span class="lxp-price-label">Starting From</span>
            <span class="lxp-price-value">{{ p.startingPrice }}</span>
          </div>
          <div class="lxp-price-sub">
            <div class="lxp-pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
              </svg>
              {{ p.completionDate }}
            </div>
            <div class="lxp-pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v20M2 12h20"/>
              </svg>
              {{ p.paymentPlan }}
            </div>
            <div class="lxp-pill lxp-pill--sqft">{{ p.pricePerSqft }} / sqft</div>
          </div>
        </div>

        <!-- Actions -->
        <div class="lxp-card-actions">
          <button class="lxp-btn-primary">
            View Project
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M7 17L17 7M17 7H7M17 7v10"/>
            </svg>
          </button>
          <a [href]="'https://wa.me/971525209703?text=I am interested in ' + p.title"
             target="_blank" rel="noopener" class="lxp-btn-wa">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
            </svg>
            Enquire
          </a>
          <a href="mailto:contact@livwelldubai.com" class="lxp-btn-email">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
            </svg>
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Newsletter ──────────────────────────────────────── -->
  <app-newsletter-section></app-newsletter-section>

  <!-- ── SEO Links + Offices ────────────────────────────── -->
  <app-seo-links-section></app-seo-links-section>

</div>
